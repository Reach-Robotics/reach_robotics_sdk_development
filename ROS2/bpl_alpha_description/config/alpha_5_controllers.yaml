controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    manipulator_controller:
      type: "joint_trajectory_controller/JointTrajectoryController"

    gripper_controller:
      type: "joint_trajectory_controller/JointTrajectoryController"

    joint_state_broadcaster:
      type: "joint_state_broadcaster/JointStateBroadcaster"

manipulator_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - alpha_axis_b
      - alpha_axis_c
      - alpha_axis_d
      - alpha_axis_e
    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: true
    state_publish_rate: 50
gripper_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - alpha_axis_a
    allow_nonzero_velocity_at_trajectory_end: true
    state_publish_rate: 50